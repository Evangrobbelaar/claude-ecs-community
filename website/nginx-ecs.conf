# Claude ECS Website — Nginx Configuration
# Deploy to: /etc/nginx/sites-available/claude-ecs
# Enable with: sudo ln -s /etc/nginx/sites-available/claude-ecs /etc/nginx/sites-enabled/
# Test with: sudo nginx -t
# Reload with: sudo systemctl reload nginx

server {
    listen 3000;
    server_name _;

    root /var/www/claude-ecs;
    index index.html;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(css|js|png|jpg|jpeg|gif|svg|ico|woff|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 256;

    # Logs
    access_log /var/log/nginx/claude-ecs-access.log;
    error_log /var/log/nginx/claude-ecs-error.log;
}
